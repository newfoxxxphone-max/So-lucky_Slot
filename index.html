<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Lucky Slots</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(30, 30, 50, 0.9);
            border: 4px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,215,0,0.2);
            text-align: center;
            position: relative;
        }

        h1 {
            color: #ffd700;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tagline {
            color: #00ffcc;
            font-size: 0.9rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #444;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        #balance {
            color: #00ff66;
        }

        .slot-machine {
            background: #111;
            border: 3px solid #444;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            padding: 20px 10px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .slot-machine::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 0, 0, 0.5);
            z-index: 2;
            pointer-events: none;
        }

        .reel {
            background: #fff;
            color: #000;
            font-size: 3.5rem;
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 10px;
            border: 2px solid #ddd;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }

        .btn {
            background: linear-gradient(180deg, #ffcc00, #ff9900);
            border: none;
            color: #111;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255,153,0,0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255,153,0,0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: #555;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-cashout {
            background: linear-gradient(180deg, #00ffcc, #0099cc);
            color: #111;
            box-shadow: 0 5px 15px rgba(0,255,204,0.3);
        }

        .btn-cashout:hover {
            box-shadow: 0 7px 20px rgba(0,255,204,0.5);
        }

        .message-banner {
            min-height: 50px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .win-flash {
            color: #ffd700;
            animation: flash 0.5s alternate infinite;
        }

        @keyframes flash {
            from { opacity: 0.3; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1.02); }
        }

        /* Modal Overlay styles */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 20, 0.95);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(0, 255, 204, 0.2);
            border-top: 5px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal-title {
            font-size: 1.4rem;
            color: #ffd700;
            margin-bottom: 15px;
        }

        .modal-text {
            font-size: 0.95rem;
            color: #ddd;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .error-icon {
            font-size: 3.5rem;
            color: #ff3333;
            margin-bottom: 15px;
        }

        .modal-btn {
            background: #fff;
            color: #111;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: #eee;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Cashout/Processing Modal -->
        <div class="modal-overlay" id="modal">
            <div id="modal-spinner" class="spinner"></div>
            <div id="modal-error-icon" class="error-icon" style="display: none;">⚠️</div>
            <div class="modal-title" id="modal-title">Processing Secure Payout</div>
            <div class="modal-text" id="modal-text">Connecting to global banking dynamic gateways. Please do not close or refresh this application window...</div>
            <button class="modal-btn" id="modal-btn" style="display: none;" onclick="closeModal()">Return to Game</button>
        </div>

        <h1>Super Lucky Slots</h1>
        <div class="tagline">Guaranteed Daily Payout System</div>

        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-label">Your Balance</span>
                <span class="stat-value" id="balance">$15.00</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Spin Cost</span>
                <span class="stat-value">$2.00</span>
            </div>
        </div>

        <div class="slot-machine">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">🍇</div>
        </div>

        <button class="btn" id="spin-btn" onclick="spin()">Spin Wheels</button>
        <button class="btn btn-cashout" id="cashout-btn" onclick="startCashout()">Claim & Cashout</button>

        <div class="message-banner" id="message">Press SPIN to trigger your lucky day!</div>
    </div>

    <script>
        let balance = 15.00;
        let spinCount = 0;
        const spinCost = 2.00;
        
        const symbols = ['🍒', '🍋', '🍇', '🍉', '🔔', '💎', '7️⃣'];

        const balanceEl = document.getElementById('balance');
        const reel1El = document.getElementById('reel1');
        const reel2El = document.getElementById('reel2');
        const reel3El = document.getElementById('reel3');
        const spinBtn = document.getElementById('spin-btn');
        const messageEl = document.getElementById('message');
        const modal = document.getElementById('modal');
        const modalSpinner = document.getElementById('modal-spinner');
        const modalErrorIcon = document.getElementById('modal-error-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalBtn = document.getElementById('modal-btn');

        function updateUI() {
            balanceEl.textContent = `$${balance.toFixed(2)}`;
        }

        function spin() {
            if (balance < spinCost) {
                messageEl.textContent = "Insufficient funds! Try claiming your current balance.";
                messageEl.className = "message-banner";
                return;
            }

            balance -= spinCost;
            spinCount++;
            updateUI();

            spinBtn.disabled = true;
            messageEl.textContent = "🎰 Shuffling algorithms...";
            messageEl.className = "message-banner";

            let iterations = 0;
            const interval = setInterval(() => {
                reel1El.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                reel2El.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                reel3El.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                iterations++;
                if (iterations > 12) {
                    clearInterval(interval);
                    determineOutcome();
                }
            }, 80);
        }

        function determineOutcome() {
            spinBtn.disabled = false;
            
            if (spinCount === 1) {
                // Guaranteed Big Win
                reel1El.textContent = '💎';
                reel2El.textContent = '💎';
                reel3El.textContent = '💎';
                balance += 25.00;
                messageEl.textContent = "🎉 MEGA WIN! +$25.00 !!";
                messageEl.className = "message-banner win-flash";
            } 
            else if (spinCount === 2) {
                // Guaranteed Jackpot
                reel1El.textContent = '7️⃣';
                reel2El.textContent = '7️⃣';
                reel3El.textContent = '7️⃣';
                balance += 75.00;
                messageEl.textContent = "👑 SUPER JACKPOT! +$75.00 !!";
                messageEl.className = "message-banner win-flash";
            } 
            else {
                // Near Misses loop
                const rand = Math.random();
                if (rand < 0.6) {
                    // Classic 2 out of 3 frustration
                    reel1El.textContent = '7️⃣';
                    reel2El.textContent = '7️⃣';
                    // Picks anything except a 7
                    let pseudoPool = ['🍒', '🍋', '🍇', '🍉', '🔔', '💎'];
                    reel3El.textContent = pseudoPool[Math.floor(Math.random() * pseudoPool.length)];
                    messageEl.textContent = "So close! Try spinning again!";
                } else {
                    // Completely mismatched
                    reel1El.textContent = '🍒';
                    reel2El.textContent = '🍋';
                    reel3El.textContent = '🔔';
                    messageEl.textContent = "No luck this round. Keep it going!";
                }
            }
            updateUI();
        }

        function startCashout() {
            modal.classList.add('active');
            modalSpinner.style.display = 'block';
            modalErrorIcon.style.display = 'none';
            modalTitle.textContent = "Processing Secure Payout";
            modalText.textContent = "Connecting to global banking dynamic gateways. Please do not close or refresh this application window...";
            modalBtn.style.display = 'none';

            // Stage 1: Fake network routing
            setTimeout(() => {
                modalTitle.textContent = "Validating Ledger Integrity";
                modalText.textContent = `Verifying current safe escrow balance of $${balance.toFixed(2)} with regional banking compliance databases...`;
                
                // Stage 2: Roadblock execution
                setTimeout(() => {
                    modalSpinner.style.display = 'none';
                    modalErrorIcon.style.display = 'block';
                    modalTitle.textContent = "Transaction Suspended";
                    modalText.textContent = `Error Code: 0x8849 - Account Unverified.\n\nSecurity systems detected an unlinked device configuration. To unlock your $${balance.toFixed(2)} dashboard holding balance, complete standard gateway system mainenance validation.`;
                    modalBtn.style.display = 'block';
                    modalBtn.textContent = "Resolve Verification Error";
                    
                    // Modify button function to simulate an endless crash loop if clicked
                    modalBtn.onclick = () => {
                        modalErrorIcon.style.display = 'none';
                        modalSpinner.style.display = 'block';
                        modalTitle.textContent = "Gateway Timeout";
                        modalText.textContent = "504 System Error: Validation server down for emergency scheduled platform maintenance. Payout lock remains active. Retrying channel handshake in 3600 seconds...";
                        modalBtn.style.display = 'none';
                        
                        setTimeout(() => {
                            closeModal();
                        }, 5000);
                    };
                }, 3000);
            }, 2500);
        }

        function closeModal() {
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
